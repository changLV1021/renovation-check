<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="clipboard-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34495e"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
  </defs>

  <!-- Clipboard body -->
  <rect x="18" y="12" width="64" height="78" rx="6" ry="6" fill="url(#clipboard-shade)"/>

  <!-- Clipboard inner area -->
  <rect x="24" y="22" width="52" height="62" rx="3" ry="3" fill="#ffffff" opacity="0.95"/>

  <!-- Clipboard clip (top) -->
  <rect x="32" y="6" width="36" height="16" rx="4" ry="4" fill="#2c3e50"/>
  <rect x="36" y="10" width="28" height="8" rx="2" ry="2" fill="#f8f9fa"/>

  <!-- Checkmark -->
  <polyline points="30,52 44,66 70,38" fill="none" stroke="#27ae60" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
